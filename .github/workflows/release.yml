name: Release

# Push a tag such as v0.2.0 to build ChildLock.exe and publish it as a GitHub release,
# with the matching CHANGELOG.md section as the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match version $version in Directory.Build.props" }

      - name: Unit tests
        run: dotnet test ChildLock.slnx -c Release --filter "Category!=Integration"

      - name: Publish
        run: dotnet publish src/ChildLock -c Release -o publish

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version))( |$)").LineNumber
          if (-not $start) { throw "No '## $version' section in CHANGELOG.md" }
          $notes = $lines[$start..($lines.Length - 1)] | ForEach-Object -Begin { $done = $false } -Process {
            if ($_ -match '^## ') { $done = $true }
            if (-not $done) { $_ }
          }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/ChildLock.exe --title "ChildLock ${{ github.ref_name }}" --notes-file notes.md
